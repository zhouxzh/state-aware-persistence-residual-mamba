name: sci-agent
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.13
  - cuda-nvcc=13.0
  - pip
  - pip:
      - torch==2.13.0
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - matplotlib==3.9.4
      - einops==0.8.1
      - mamba-ssm==2.3.1
      - reformer-pytorch==1.4.4
      - optuna==4.4.0
      - statsmodels==0.14.6
      - yfinance==1.2.0
      - transformers==4.57.6
      - ninja==1.13.0
      - pytest==9.1.1

# This is the tested construction recipe, not a binary lock file. Mamba-SSM is
# compiled locally for the available GPU architecture. Activate the environment
# and set CUDA_HOME=$CONDA_PREFIX before installing or executing Mamba code.
