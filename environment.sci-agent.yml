name: sci-agent
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - matplotlib=3.9.2
  - pytest=8.3.4
  - statsmodels=0.14.6
  - ninja=1.13.2
  - pip:
      - einops==0.8.0
      - huggingface-hub==0.26.5
      - mamba-ssm==2.2.5
      - ninja==1.13.0
      - optuna==4.4.0
      - requests==2.32.3
      - torch==2.5.1+cu121
      - transformers==4.46.3
      - yfinance==0.2.54

# Install Torch from https://download.pytorch.org/whl/cu121, then locally build
# mamba-ssm with CUDA_HOME=/usr, MAMBA_FORCE_BUILD=TRUE, and sm_75 for this GPU.
